<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS DISAMAKAN DENGAN KASIR AGAR IDENTIK */
        :root { --primary: #059669; /* Hijau untuk Task */ --sidebar-bg: #064e3b; --bg: #f8fafc; --text: #334155; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; background-color: var(--bg); color: var(--text); min-height: 100vh; }
        
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: white; display: flex; flex-direction: column; transition: 0.3s; }
        .sidebar-brand { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand h3 { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
        
        .sidebar-menu { list-style: none; padding: 15px 0; flex: 1; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #a7f3d0; text-decoration: none; font-size: 14px; font-weight: 500; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid var(--primary); }
        .sidebar-menu li a i { width: 20px; text-align: center; }
        
        .btn-back-menu { background: rgba(239, 68, 68, 0.1); border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto; }
        .btn-back-menu a { color: #fca5a5 !important; }
        
        .main-content { flex: 1; padding: 30px; overflow-y: auto; max-width: 800px; margin: 0 auto; }
        
        .task-input-container { display: flex; gap: 10px; margin-bottom: 24px; }
        input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px; outline: none; font-size: 14px; }
        input:focus { border-color: var(--primary); }
        button { padding: 12px 20px; border: none; border-radius: 6px; background: var(--primary); color: white; font-weight: 500; cursor: pointer; }
        
        /* List Task Modern */
        ul#taskList { list-style: none; padding: 0; }
        ul#taskList li { background: white; border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        ul#taskList li.completed span { text-decoration: line-through; color: #94a3b8; }
        
        .mobile-nav { display: none; background: var(--sidebar-bg); padding: 15px 20px; color: white; align-items: center; justify-content: space-between; }
        @media(max-width: 768px) { body { flex-direction: column; } .sidebar { display: none; width: 100%; } .sidebar.active { display: flex; } .mobile-nav { display: flex; } }
    </style>
</head>
<body>

    <div class="mobile-nav">
        <h3 style="font-size: 16px;">Task Tracker</h3>
        <button onclick="document.querySelector('.sidebar').classList.toggle('active')" style="background: transparent; padding: 0;"><i class="fa-solid fa-bars" style="font-size: 20px;"></i></button>
    </div>

    <div class="sidebar">
        <div class="sidebar-brand">
            <h3><i class="fa-solid fa-list-check"></i> Task Tracker</h3>
        </div>
        <ul class="sidebar-menu">
    <li><a href="#" class="active"><i class="fa-solid fa-tasks"></i> Daftar Tugas</a></li>
    <li class="btn-back-menu"><a href="public/dashboard.html" id="back-to-menu"><i class="fa-solid fa-arrow-left"></i> Kembali ke Menu</a></li>
</ul>
    </div>

    <div class="main-content">
        <h2 style="margin-bottom: 20px; font-size: 22px; color: #0f172a;">Tugas Hari Ini</h2>
        
        <div class="task-input-container">
            <input type="text" id="taskInput" placeholder="Tambahkan tugas baru...">
            <button onclick="addTask()"><i class="fa-solid fa-plus"></i> Tambah</button>
        </div>
        <!-- Tombol Filter Status (Bahasa Inggris) -->
<div class="task-tabs" style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
    <button class="tab-btn active" data-status="all">All</button>
    <button class="tab-btn" data-status="todo">To Do</button>
    <button class="tab-btn" data-status="in-progress">In Progress</button>
    <button class="tab-btn" data-status="done">Done</button>
</div>

        <ul id="taskList">
            <!-- Data task dari JS akan dirender disini -->
        </ul>
    </div>
    

    <!-- SCRIPT JS TASK TRACKER KAMU -->
    <script src="script.js"></script>
</body>
</html>
