    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Masuk & Daftar - STUDETOLS</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 font-sans">

        <div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl w-full max-w-md p-8 border border-white/20 transition-all duration-300">
            <!-- Logo & Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white font-extrabold text-2xl shadow-lg shadow-indigo-600/30 mb-3">ST</div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">STUDETOLS</h1>
                <p class="text-sm text-slate-500 mt-1">Platform Tools untuk para murid</p>
            </div>
            
            <!-- Tab Navigasi -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white text-indigo-600 shadow-sm">Masuk</button>
                <button onclick="switchTab('register')" id="tabRegister" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-500 hover:text-slate-800">Buat Akun</button>
            </div>

            <!-- Form Login -->
            <div id="loginFormContainer" class="space-y-4">
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Username</label>
                        <input type="text" id="loginUsername" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm bg-slate-50/50" placeholder="Masukkan username">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                        <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm bg-slate-50/50" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/25 transition duration-200 text-sm">Masuk ke Sistem</button>
                    <div id="loginMsg" class="text-xs text-center font-medium text-red-500 hidden pt-2"></div>
                </form>
            </div>

            <!-- Form Register -->
            <div id="registerFormContainer" class="space-y-4 hidden">
                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Username Baru</label>
                        <input type="text" id="regUsername" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm bg-slate-50/50" placeholder="Pilih username unik">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                        <input type="password" id="regPassword" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm bg-slate-50/50" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nama / Label Profil</label>
                        <input type="text" id="regLabel" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm bg-slate-50/50" placeholder="Contoh: Ihsan Hafidz">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/25 transition duration-200 text-sm">Daftar Akun Baru</button>
                    <div id="regMsg" class="text-xs text-center font-medium pt-2"></div>
                </form>
            </div>
        </div>

        <script>
            function switchTab(tab) {
                const tabLogin = document.getElementById('tabLogin');
                const tabRegister = document.getElementById('tabRegister');
                const loginContainer = document.getElementById('loginFormContainer');
                const regContainer = document.getElementById('registerFormContainer');

                if (tab === 'login') {
                    tabLogin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white text-indigo-600 shadow-sm";
                    tabRegister.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-500 hover:text-slate-800";
                    loginContainer.classList.remove('hidden');
                    regContainer.classList.add('hidden');
                } else {
                    tabRegister.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white text-emerald-600 shadow-sm";
                    tabLogin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-500 hover:text-slate-800";
                    regContainer.classList.remove('hidden');
                    loginContainer.classList.add('hidden');
                }
            }

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                const msg = document.getElementById('loginMsg');

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        localStorage.setItem('studetols_token', data.token);
                        localStorage.setItem('studetols_profile', data.label);
                        localStorage.setItem('studetols_role', data.role);
                        window.location.href = '/dashboard.html';
                    } else {
                        msg.classList.remove('hidden');
                        msg.textContent = data.error;
                    }
                } catch (err) {
                    msg.classList.remove('hidden');
                    msg.textContent = 'Gagal terhubung ke server.';
                }
            });

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('regUsername').value.trim();
                const password = document.getElementById('regPassword').value.trim();
                const label = document.getElementById('regLabel').value.trim();
                const msg = document.getElementById('regMsg');

                try {
                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, label })
                    });
                    const data = await res.json();

                    msg.classList.remove('hidden');
                    if (res.ok) {
                        msg.className = "text-xs text-center font-medium text-emerald-600 pt-2";
                        msg.textContent = 'Akun berhasil dibuat! Silakan masuk.';
                        document.getElementById('registerForm').reset();
                        setTimeout(() => switchTab('login'), 1500);
                    } else {
                        msg.className = "text-xs text-center font-medium text-red-500 pt-2";
                        msg.textContent = data.error;
                    }
                } catch (err) {
                    msg.classList.remove('hidden');
                    msg.className = "text-xs text-center font-medium text-red-500 pt-2";
                    msg.textContent = 'Gagal terhubung ke server.';
                }
            });
        </script>
    </body>
    </html>
